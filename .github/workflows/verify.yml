name: Verify wallet libraries

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede older runs of the same PR or branch, including main.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'all' }}
        run: python3 scripts/ci.py "$BASE_SHA" >> "$GITHUB_OUTPUT"

  lightweight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show
      - name: Run repository preflight
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          for step in json.loads(Path('.github/preflight.json').read_text())['steps']:
              print(step['name'], flush=True)
              subprocess.run(step['argv'], check=True)
          PY
      - run: git diff --exit-code

  repository-checks:
    needs: prepare
    if: needs.prepare.outputs.rust == 'true'
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: dependency-boundary
            fetch-depth: 1
          - check: zakura-graph
            fetch-depth: 1
          - check: wallet-lib-modes
            fetch-depth: 1
          - check: vendor-ancestry
            fetch-depth: 0
          - check: dependency-graph
            fetch-depth: 1
    env:
      WALLET_LIB_BUILD_ROOT: ${{ github.workspace }}/target/dev-lanes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: ${{ matrix.fetch-depth }}
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: matrix.check != 'vendor-ancestry'
        with:
          key: repository-${{ matrix.check }}
          cache-workspace-crates: true
          cache-on-failure: true
          workspaces: . -> target/dev-lanes
      - run: python3 scripts/dev.py verify --only "${{ matrix.check }}"

  test-configurations:
    needs: prepare
    if: needs.prepare.outputs.rust == 'true'
    name: test-${{ matrix.config }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config: [pir-protocol, pir-client, pir-server, default, sync, tor, zewif, orchard, transparent, transparent-import, proving, pczt, pczt-wallet, sqlite, enhance-wallet, enhance, transparent-filter-client, enhance-testing, transparent-engine, transparent-engine-store, transparent-pir, transparent-pir-sqlite, transparent-pir-testing, receiver-wallet, transaction-status-core, transaction-status-lightwalletd, receiver-protocol, transaction-wire, service-config, pir-config]
    env:
      WALLET_LIB_BUILD_ROOT: ${{ github.workspace }}/target/dev-lanes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: tests-${{ matrix.config }}
          cache-workspace-crates: true
          cache-on-failure: true
          workspaces: . -> target/dev-lanes
      - run: python3 scripts/dev.py test --config "${{ matrix.config }}"
      - run: git diff --exit-code

  protobuf:
    needs: prepare
    if: needs.prepare.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WALLET_LIB_BUILD_ROOT: ${{ github.workspace }}/target/dev-lanes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: protobuf
          cache-workspace-crates: true
          cache-on-failure: true
          workspaces: . -> target/dev-lanes
      - name: Install pinned protoc
        env:
          # sha256 of the release asset for the version in scripts/protoc-version.txt.
          # GitHub release assets can be replaced under the same URL, so the version
          # string pins the recipe but not the bytes we then execute. Bump this with
          # the version: shasum -a 256 protoc-<version>-linux-x86_64.zip
          PROTOC_SHA256: af27ea66cd26938fe48587804ca7d4817457a08350021a1c6e23a27ccc8c6904
        run: |
          version=$(cat scripts/protoc-version.txt)
          url="https://github.com/protocolbuffers/protobuf/releases/download/v${version}/protoc-${version}-linux-x86_64.zip"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/protoc.zip" "$url"
          echo "${PROTOC_SHA256}  $RUNNER_TEMP/protoc.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
      - run: python3 scripts/proto.py check
      - run: git diff --exit-code

  tests:
    if: always()
    needs: [prepare, lightweight, repository-checks, test-configurations, protobuf]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert jobs['prepare']['result'] == 'success', jobs
          assert jobs['lightweight']['result'] == 'success', jobs
          expected = 'success' if jobs['prepare']['outputs']['rust'] == 'true' else 'skipped'
          for name in ('repository-checks', 'test-configurations', 'protobuf'):
              assert jobs[name]['result'] == expected, jobs
          PY
