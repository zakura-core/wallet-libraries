name: Verify wallet libraries

on:
  pull_request:
    paths:
      - ".github/workflows/verify.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "wallet-lib/**"
      - "librustzcash/**"
      - "zakura/**"
      - "manifests/**"
      - "patches/**"
      - "scripts/**"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: zakura-graph
            fetch-depth: 1
          - check: wallet-lib-modes
            fetch-depth: 1
          - check: vendor-ancestry
            fetch-depth: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: ${{ matrix.fetch-depth }}
      - run: ./scripts/verify-${{ matrix.check }}.sh

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The facade has mutually exclusive backends; the PIR client is tested below.
      - name: Default workspace
        run: cargo test --workspace --exclude zakura-wallet-lib --exclude zakura-pir-enhance --locked

      - name: PIR wallet integration
        run: cargo test -p zakura-client-backend -p zakura-client-sqlite --features orchard,test-dependencies --locked

      # Without Orchard, the SQLite store routes every payload request to public work.
      - name: SQLite wallet without Orchard
        run: cargo test -p zakura-client-sqlite --features test-dependencies --locked

      # `native-reinspiring` replaces the v7 protocol at compile time, so it is
      # tested on its own rather than through `--all-features`.
      - name: PIR client
        run: |
          cargo test -p zakura-pir-enhance --features wallet --locked
          cargo test -p zakura-pir-enhance --locked
          cargo test -p zakura-pir-enhance --release --locked --test compatibility -- --ignored

      - name: PIR client (experimental native profile)
        run: cargo test -p zakura-pir-enhance --features native-reinspiring --locked
