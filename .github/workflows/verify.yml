name: Verify wallet libraries

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only older revisions of the same PR are superseded. Every main push gets
# its own group, including pending pushes.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'all' }}
        run: python3 scripts/ci.py "$BASE_SHA" >> "$GITHUB_OUTPUT"

  lightweight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: cargo fmt --all -- --check
      - run: git diff --exit-code

  repository-checks:
    needs: prepare
    if: needs.prepare.outputs.rust == 'true'
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: zakura-graph
            fetch-depth: 1
          - check: wallet-lib-modes
            fetch-depth: 1
          - check: vendor-ancestry
            fetch-depth: 0
    env:
      WALLET_LIB_BUILD_ROOT: ${{ github.workspace }}/target/dev-lanes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: ${{ matrix.fetch-depth }}
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: matrix.check != 'vendor-ancestry'
        with:
          key: repository-${{ matrix.check }}
          workspaces: . -> target/dev-lanes
      - run: python3 scripts/dev.py verify --only "${{ matrix.check }}"

  test-configurations:
    needs: prepare
    if: needs.prepare.outputs.rust == 'true'
    name: test-${{ matrix.config }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config: [default, orchard, transparent, transparent-import, sqlite, enhance-wallet, enhance, transparent-pir, transparent-pir-sqlite]
    env:
      WALLET_LIB_BUILD_ROOT: ${{ github.workspace }}/target/dev-lanes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: tests-${{ matrix.config }}
          workspaces: . -> target/dev-lanes
      - run: python3 scripts/dev.py test --config "${{ matrix.config }}"
      - run: git diff --exit-code

  protobuf:
    needs: prepare
    if: needs.prepare.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WALLET_LIB_BUILD_ROOT: ${{ github.workspace }}/target/dev-lanes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: protobuf
          workspaces: . -> target/dev-lanes
      - name: Install pinned protoc
        run: |
          version=$(cat scripts/protoc-version.txt)
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${version}/protoc-${version}-linux-x86_64.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
      - run: python3 scripts/proto.py check
      - run: git diff --exit-code

  tests:
    if: always()
    needs: [prepare, lightweight, repository-checks, test-configurations, protobuf]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert jobs['prepare']['result'] == 'success', jobs
          assert jobs['lightweight']['result'] == 'success', jobs
          expected = 'success' if jobs['prepare']['outputs']['rust'] == 'true' else 'skipped'
          for name in ('repository-checks', 'test-configurations', 'protobuf'):
              assert jobs[name]['result'] == expected, jobs
          PY
