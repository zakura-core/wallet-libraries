name: One-time IVK scenarios

# Real encrypted PIR and transaction proof scenarios run nightly and on request.
on:
  schedule:
    # Scheduled runs only fire on the default branch.
    - cron: "43 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-time-ivk-scenarios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenarios:
    name: test-one-time-ivk-scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WALLET_LIB_BUILD_ROOT: ${{ github.workspace }}/target/dev-lanes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: tests-one-time-ivk-scenarios
          cache-workspace-crates: true
          cache-on-failure: true
          workspaces: . -> target/dev-lanes
      - run: |
          mkdir -p target/one-time-ivk-scenarios-report
          set -o pipefail
          python3 scripts/dev.py test --config one-time-ivk-scenarios 2>&1 | tee target/one-time-ivk-scenarios-report/results.log
      - name: Retain the scenario report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: one-time-ivk-scenarios-${{ github.run_attempt }}
          path: ${{ github.workspace }}/target/one-time-ivk-scenarios-report
          if-no-files-found: warn
