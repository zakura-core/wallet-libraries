name: Published wallet upgrades

# Builds a probe against each published writer and the current tree, so it runs when
# wallet schema code or the check changes, nightly to catch everything else, and on request.
on:
  pull_request:
    paths:
      - "librustzcash/zcash_client_sqlite/src/wallet/init.rs"
      - "librustzcash/zcash_client_sqlite/src/wallet/init/**"
      - "librustzcash/zcash_client_sqlite/src/wallet/db.rs"
      - "scripts/check-published-wallet-upgrades.py"
      - "scripts/probes/**"
      - ".github/workflows/published-wallet-upgrades.yml"
  schedule:
    # Scheduled runs only fire on the default branch.
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: published-wallet-upgrades-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  upgrades:
    name: check-published-wallet-upgrades
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The check archives the pre-migration revision from history.
          fetch-depth: 0
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: published-wallet-upgrades
          cache-workspace-crates: true
          cache-on-failure: true
          workspaces: . -> target/published-wallet-upgrades
      - run: python3 scripts/check-published-wallet-upgrades.py --target-dir "${{ github.workspace }}/target/published-wallet-upgrades"
