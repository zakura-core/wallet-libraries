[package]
name = "zakura-wallet-lib"
version = "0.1.0-rc3"
authors = ["Zakura developers"]
description = """
Selects either the upstream librustzcash wallet stack or its Zakura forks, so
one source tree can build against both.
"""
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/zakura-core/wallet-libraries"
categories = ["cryptography::cryptocurrencies"]
keywords = ["zcash", "zakura"]

[lib]
name = "zakura_wallet_lib"

# Exactly one backend is active at a time, so each family is optional and
# enabled by its own feature. Cargo features are additive and cannot express
# "enable this when that is off", which is why the upstream family needs a
# named feature rather than being the implicit `not(zakura)` case.
#
# Every key is renamed explicitly, so the extern name a re-export refers to is
# the key itself, not the library target name — which is deliberately identical
# across both families.
[dependencies]

# -- upstream (crates.io), pinned to the release this repository forks --------
lrz-client-backend = { package = "zcash_client_backend", version = "0.24.0-rc.7", default-features = false, optional = true }
lrz-client-sqlite = { package = "zcash_client_sqlite", version = "0.22.0-rc.7", default-features = false, optional = true }
lrz-keys = { package = "zcash_keys", version = "0.16.1", default-features = false, optional = true }
lrz-orchard = { package = "orchard", version = "0.15", optional = true }
lrz-pczt = { package = "pczt", version = "0.9.2", optional = true }
lrz-primitives = { package = "zcash_primitives", version = "0.30.0", default-features = false, optional = true }

# -- Zakura: the default stack, under the upstream names consumers expect ----
zcash-client-backend = { package = "zakura-client-backend", path = "../librustzcash/zcash_client_backend", version = "0.1.0-rc3", default-features = false, optional = true }
zcash-client-sqlite = { package = "zakura-client-sqlite", path = "../librustzcash/zcash_client_sqlite", version = "0.1.0-rc3", default-features = false, optional = true }
zcash-keys = { package = "zakura-keys", version = "=1.0.0-rc.4", default-features = false, optional = true }
orchard = { package = "zakura-orchard", version = "=1.0.0-rc.4", optional = true }
pczt = { package = "zakura-pczt", path = "../librustzcash/pczt", version = "0.1.0-rc1", optional = true }
zcash-primitives = { package = "zakura-primitives", version = "=1.0.0-rc.4", default-features = false, optional = true }

# Cargo prerelease requirements also accept newer release candidates. Keep
# every transitive crate in the default Zakura graph on RC4 so a fresh
# consumer lockfile cannot mix in an MSRV-incompatible release.
zakura-bellman-pin = { package = "zakura-bellman", version = "=1.0.0-rc.4", default-features = false, optional = true }
zakura-bls12-381-pin = { package = "zakura-bls12-381", version = "=1.0.0-rc.4", default-features = false, optional = true }
zakura-halo2-gadgets-pin = { package = "zakura-halo2-gadgets", version = "=1.0.0-rc.4", default-features = false, optional = true }
zakura-halo2-legacy-pdqsort-pin = { package = "zakura-halo2-legacy-pdqsort", version = "=1.0.0-rc.4", default-features = false, optional = true }
zakura-halo2-poseidon-pin = { package = "zakura-halo2-poseidon", version = "=1.0.0-rc.4", default-features = false, optional = true }
zakura-halo2-proofs-pin = { package = "zakura-halo2-proofs", version = "=1.0.0-rc.4", default-features = false, optional = true }
zakura-jubjub-pin = { package = "zakura-jubjub", version = "=1.0.0-rc.4", default-features = false, optional = true }
zakura-pairing-pin = { package = "zakura-pairing", version = "=1.0.0-rc.4", default-features = false, optional = true }
zakura-pasta-curves-pin = { package = "zakura-pasta-curves", version = "=1.0.0-rc.4", default-features = false, optional = true }
zakura-reddsa-pin = { package = "zakura-reddsa", version = "=1.0.0-rc.4", default-features = false, optional = true }
zakura-redjubjub-pin = { package = "zakura-redjubjub", version = "=1.0.0-rc.4", default-features = false, optional = true }
zakura-sapling-crypto-pin = { package = "zakura-sapling-crypto", version = "=1.0.0-rc.4", default-features = false, optional = true }
zakura-sinsemilla-pin = { package = "zakura-sinsemilla", version = "=1.0.0-rc.4", default-features = false, optional = true }

[features]
default = ["zakura"]

## Complete upstream librustzcash capability set required by zcash_voting.
lrz = [
    "dep:lrz-client-backend",
    "dep:lrz-client-sqlite",
    "dep:lrz-keys",
    "dep:lrz-orchard",
    "dep:lrz-pczt",
    "dep:lrz-primitives",
    "lrz-client-backend/orchard",
    "lrz-client-backend/lightwalletd-tonic",
    "lrz-client-backend/lightwalletd-tonic-tls-webpki-roots",
    "lrz-client-sqlite/orchard",
    "lrz-keys/orchard",
    "lrz-orchard/circuit",
    "lrz-orchard/unstable-voting-circuits",
    "lrz-pczt/orchard",
    "lrz-pczt/io-finalizer",
    "lrz-pczt/signer",
    "lrz-pczt/zcp-builder",
]

## Complete Zakura capability set required by zcash_voting. This is the default.
zakura = [
    "dep:zcash-client-backend",
    "dep:zcash-client-sqlite",
    "dep:zcash-keys",
    "dep:orchard",
    "dep:pczt",
    "dep:zcash-primitives",
    "dep:zakura-bellman-pin",
    "dep:zakura-bls12-381-pin",
    "dep:zakura-halo2-gadgets-pin",
    "dep:zakura-halo2-legacy-pdqsort-pin",
    "dep:zakura-halo2-poseidon-pin",
    "dep:zakura-halo2-proofs-pin",
    "dep:zakura-jubjub-pin",
    "dep:zakura-pairing-pin",
    "dep:zakura-pasta-curves-pin",
    "dep:zakura-reddsa-pin",
    "dep:zakura-redjubjub-pin",
    "dep:zakura-sapling-crypto-pin",
    "dep:zakura-sinsemilla-pin",
    "zcash-client-backend/orchard",
    "zcash-client-backend/lightwalletd-tonic",
    "zcash-client-backend/lightwalletd-tonic-tls-webpki-roots",
    "zcash-client-sqlite/orchard",
    "zcash-keys/orchard",
    "orchard/circuit",
    "orchard/std",
    "orchard/unstable-voting-circuits",
    "pczt/orchard",
    "pczt/io-finalizer",
    "pczt/signer",
    "pczt/zcp-builder",
]
