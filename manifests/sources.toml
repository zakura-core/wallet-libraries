# Upstream source and generation rules for the Zakura wallet layer.
#
# This repository vendors only the librustzcash crates that Vizor needs and
# that `zakura-core/libraries` does not already provide. Everything else is
# consumed from crates.io, either as an upstream release or as a published
# `zakura-*` fork.
#
# `ref` is the human-readable release tag. `commit` is the peeled commit that
# the sync script verifies, so retagging cannot silently change the source.
#
# `tag_pattern` selects the upstream tags that represent a release of this
# source, and must capture a `version` group used for semantic-version
# ordering. `allow_prerelease` decides whether the scheduled discovery job may
# propose a prerelease tag; a manual override can always pin one.

# Repository layout. `vendored_directory` holds the generated forks; the sync
# script owns it completely and deletes it before every extraction, so nothing
# hand-written may live there. `extra_members` are hand-written workspace
# members that sync never touches: the compatibility facade, and new Zakura
# work such as the PIR-based sync engine.
[layout]
vendored_directory = "librustzcash"
# Pristine upstream lives on its own branch, and releases arrive on `main` as
# merges from it. `upstream_manifest` is upstream's workspace manifest, carried
# under a name Cargo does not read: the root Cargo.toml is generated from it,
# so the dependency rewiring never takes part in a merge.
vendor_branch = "vendor/librustzcash"
upstream_manifest = "librustzcash/upstream-workspace.toml"
# `zakura/` members are added here as they are written.
extra_members = ["zakura/pir-protocol", "zakura/pir-server-core", "zakura/pir-publisher", "zakura/pir-query-server", "zakura/pir-client", "zakura/filters", "wallet-lib", "zakura/one-time-ivk", "zakura/near-intents", "zakura/one-time-ivk-scenarios", "zakura/transaction-wire", "zakura/service-config", "zakura/pir-config"]
# The backend selector. Named separately because the verification scripts have
# to build it one backend at a time, unlike every other member.
facade = "wallet-lib"
# Inherited by every vendored crate through workspace package metadata.
repository = "https://github.com/zakura-core/wallet-libraries"
rust_version = "1.97"

[[source]]
name = "librustzcash"
url = "https://github.com/zcash/librustzcash.git"
ref = "zcash_client_sqlite-0.22.0-rc.7"
# The vendor-branch commit carrying this release. CI checks it is an ancestor
# of HEAD, which is what proves the tree was merged rather than hand-edited.
vendor_commit = "8c83527a850883897de05a51bb18f6a70237c70f"
# The librustzcash repository tags every crate independently. `zcash_voting`
# selects the release train by its `zcash_client_sqlite` version, so that is
# the tag series this repository follows.
tag_pattern = "^zcash_client_sqlite-(?P<version>.+)$"
allow_prerelease = true

# The vendored crates, in dependency order. `path` is the directory inside the
# upstream repository; it is reused verbatim under `librustzcash/` so that `use`
# paths and integration tests keep working. `package` is the published name,
# reserved in `zakura-core/reserved`; the library target keeps the upstream
# name, matching the convention in `zakura-core/libraries`. `version` is the
# Zakura release, independent of the inherited upstream version: the first
# published lineage starts at `0.1.0-rc0`.
#
# Membership rule, inherited from that repository and verified by
# `scripts/verify-zakura-graph.sh`: a crate belongs here when it depends on the
# renamed crypto stack and `libraries` does not already ship it. A crate that
# `zakura-*` pulls from crates.io must NOT be vendored here, or the graph ends
# up carrying two incompatible copies of it.

[[crate]]
path = "pczt"
package = "zakura-pczt"
version = "0.1.0-rc9"

[[crate]]
path = "zcash_client_backend"
package = "zakura-client-backend"
version = "0.1.0-rc9.5"

[[crate]]
path = "zcash_client_sqlite"
package = "zakura-client-sqlite"
version = "0.1.0-rc9.5"

# Minimum compatible Common release; Cargo.lock records the tested versions.
# The upstream dependency key is kept, so crate sources continue to say
# `orchard::` and `zcash_primitives::` while resolving to the forks.
[rewire]
bellman = { package = "zakura-bellman", version = "4.0.0" }
bls12_381 = { package = "zakura-bls12-381", version = "4.0.0" }
jubjub = { package = "zakura-jubjub", version = "4.0.0" }
zcash_address = { package = "zakura-address", version = "4.0.0" }
zcash_protocol = { package = "zakura-protocol", version = "4.0.0" }
transparent = { package = "zakura-transparent", version = "4.0.0" }
zip321 = { package = "zakura-zip321", version = "4.0.0" }
zcash_note_encryption = { package = "zakura-note-encryption", version = "4.0.0" }
zcash_primitives = { package = "zakura-primitives", version = "4.0.0" }
zcash_keys = { package = "zakura-keys", version = "4.0.0" }
zcash_proofs = { package = "zakura-proofs", version = "4.0.0" }
orchard = { features = ["backend-halo2"], package = "zakura-orchard", version = "4.0.0" }
sapling = { package = "zakura-sapling-crypto", version = "4.0.0" }
redjubjub = { package = "zakura-redjubjub", version = "4.0.0" }
pasta_curves = { package = "zakura-pasta-curves", version = "4.0.0" }

# Non-renamed ecosystem crates whose public traits changed with the 1.0 crypto
# family. The generated workspace keeps upstream's other dependency metadata
# while replacing these version requirements.
[versions]
ff = "0.14"
group = "0.14"
rand = "0.10"
rand_core = "0.10"
rand_distr = "0.6"
bip32 = "0.6"
secp256k1 = "0.33"
zcash_script = "0.6"

# Wallet-owned packages must never import the Zakura node or wallet-pir,
# including optional, development, build and target-specific dependencies.
[dependency_boundary]
node_packages = [
  "zakura-chain",
  "zakura-consensus",
  "zakura-header-chain",
  "zakura-mmr-tree",
  "zakura-network",
  "zakura-node-services",
  "zakura-rpc",
  "zakura-script",
  "zakura-state",
  "zakura-test",
]

# Packages owned by wallet-pir, including retired packages: registry sources must
# respect the same one-way ownership boundary as git sources. Repository metadata
# is checked too, so a newly named package cannot bypass this inventory.
wallet_pir_packages = [
  "zakura-server-chain",
  "chain-ingest",
  "combined-server",
  "commitment-ingest",
  "commitment-tree-db",
  "decryption-types",
  "enhance-layout-benchmark",
  "enhance-noise-analysis",
  "enhance-pir",
  "enhance-pir-load-test",
  "enhance-pir-server",
  "enhance-q48-interop",
  "enhance-schema9-worker-capacity-benchmark",
  "enhance-width-study",
  "hashtable-pir",
  "live-pir-probe",
  "nf-ingest",
  "pir-apm",
  "pir-control",
  "pir-monitor",
  "pir-native",
  "pir-observability",
  "pir-types",
  "receiver-directory",
  "receiver-indexer",
  "receiver-pir",
  "receiver-pir-server",
  "receiver-wire",
  "spend-client",
  "spend-server",
  "spend-types",
  "transparent-block-server",
  "transparent-blocks",
  "transparent-events",
  "transparent-filter",
  "transparent-filter-server",
  "transparent-loadtest",
  "transparent-measure",
  "transparent-native",
  "transparent-regression",
  "transparent-shard",
  "transparent-shard-server",
  "transparent-spend-pir",
  "transparent-txid-client",
  "transparent-wallet",
  "transparent-wallet-store",
  "txid-sizing-export",
  "witness-client",
  "witness-server",
  "witness-types",
]

# Crate names that must never appear in a built graph: the crates.io originals
# of everything `libraries` forks. Any one of them means an edge escaped the
# rewiring, and two copies of a type that looks identical are not the same type.
[graph]
forbidden = [
  "orchard",
  "equihash",
  "sapling-crypto",
  "zcash_primitives",
  "zcash_note_encryption",
  "zcash_keys",
  "zcash_proofs",
  "zcash_address",
  "zcash_protocol",
  "zcash_transparent",
  "zip321",
  "halo2_proofs",
  "halo2_gadgets",
  "halo2_poseidon",
  "halo2_legacy_pdqsort",
  "pasta_curves",
  "sinsemilla",
  "reddsa",
  "redjubjub",
  "bellman",
  "bls12_381",
  "jubjub",
  "pairing",
]
