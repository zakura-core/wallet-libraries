# Server-only adapters between Zakura node data and the PIR services.
#
# This is its own workspace, with its own lockfile, so that no wallet build in the
# repository root workspace ever resolves the node's packages. Only PIR servers and
# their tools depend on it; it may use the wallet-owned crates under `zakura/`
# by path, never the other way round.
[workspace]
resolver = "2"
members = ["chain"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/zakura-core/wallet-libraries"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The Common 3 node revision the PIR services read. Changing it does not upgrade a
# deployed node; a direct database reader must match the running node's format.
zakura-chain = { git = "https://github.com/zakura-core/zakura.git", rev = "83738c07468bee30a7db8a8d678cb27bf60094f4" }
# Pinned to the same revision as `zakura-chain`, and it must stay that way: the
# `rocksdb` reader opens the node's database directly, so its format must match
# the running node's.
zakura-state = { git = "https://github.com/zakura-core/zakura.git", rev = "83738c07468bee30a7db8a8d678cb27bf60094f4" }
