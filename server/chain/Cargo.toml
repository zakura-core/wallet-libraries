[package]
name = "zakura-server-chain"
version = "0.0.1-rc0"
publish = false
description = "Zakura node reads and chain interpretation for the PIR services"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
## Synthetic chain fixtures for service tests: raw blocks and transactions built
## with the node's own encoders.
testing = ["dep:axum", "tokio/net", "tokio/time"]
## Reading the node's RocksDB directly, as a secondary instance; see
## `transparent::state`.
rocksdb = ["dep:zakura-state"]

[dependencies]
axum = { version = "0.7", optional = true }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
zakura-chain.workspace = true
zakura-state = { workspace = true, optional = true }
zakura-receiver-crypto = { path = "../../zakura/receiver-crypto" }

[dev-dependencies]
axum = "0.7"
chrono = { version = "0.4", default-features = false }
hex = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
# A primary database for the RocksDB reader's tests, and the public genesis block.
zakura-state.workspace = true
zakura-test.workspace = true

[[test]]
name = "enhance"
required-features = ["testing"]

[[test]]
name = "receiver"
required-features = ["testing"]

[[test]]
name = "status"
required-features = ["testing"]

[[test]]
name = "transparent"
required-features = ["testing"]

[[test]]
name = "state"
required-features = ["testing", "rocksdb"]
