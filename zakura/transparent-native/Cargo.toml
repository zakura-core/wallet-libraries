[package]
name = "zakura-transparent-native"
version = "0.0.1-rc0"
description = "Transparent's native ReinspiRING two-mask PIR profiles, shared by the shard server and the wallet"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
keywords = ["zcash", "privacy", "pir"]

[lib]
# The library keeps wallet-pir's crate name, so `transparent_native::` paths
# are unchanged for its consumers.
name = "transparent_native"

[dependencies]
hex = { workspace = true, features = ["std"] }
zakura-pir-native = { version = "=0.0.1-rc2", path = "../pir-native" }
rayon.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
ipir-sp = { version = "=0.1.0-rc.7", git = "https://github.com/valargroup/ipir-sp", rev = "a719f820c59e60c5f08997a57b875b9090b7e53e", features = ["native-reinspiring"] }
rand = "0.8"
rand_chacha.workspace = true
