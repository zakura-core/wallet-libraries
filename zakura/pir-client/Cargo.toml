[package]
name = "zakura-pir-client"
version = "0.0.1-rc4"
edition = "2024"
description = "Enhance, Status, Transparent and Receiver PIR clients over caller-owned transports"
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Product and capability features are explicit; no product is enabled by default.
cli = ["dep:zakura-pir-publisher", "transparent", "reqwest", "dep:clap"]
default = []
native = [
    "dep:zakura-pir-protocol",
    "zakura-pir-protocol/native",
    "dep:reinspiring",
    "dep:rand",
    "dep:rand_chacha",
]
enhance = [
    "zakura-pir-publisher?/enhance",
    "zakura-pir-query-server?/enhance",
    "native",
    "zakura-pir-protocol/enhance",
    "zakura-pir-protocol/http-endpoint",
    "dep:futures-util",
    "dep:base64",
    "dep:hex",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:thiserror",
]
receiver = [
    "zakura-pir-publisher?/receiver",
    "zakura-pir-query-server?/receiver",
    "native",
    "zakura-pir-protocol/receiver",
    "zakura-pir-protocol/http-endpoint",
    "dep:hex",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:thiserror",
]
status = [
    "zakura-pir-publisher?/status",
    "zakura-pir-query-server?/status",
    "native",
    "zakura-pir-protocol/status",
    "zakura-pir-protocol/http-endpoint",
    "dep:hex",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:thiserror",
    "dep:zcash_protocol",
]
transparent = [
    "zakura-pir-publisher?/transparent",
    "zakura-pir-query-server?/transparent",
    "zakura-pir-server-core?/transparent",
    "zakura-pir-protocol/filter-matching",
    "native",
    "zakura-pir-protocol/transparent",
    "zakura-pir-protocol/http-endpoint",
    "dep:base64",
    "dep:hex",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:thiserror",
]
engine-store = ["transparent", "dep:rusqlite"]
engine-conformance = ["transparent"]
recovery = [
    "engine-store",
    "zakura-pir-protocol/transparent-inputs",
    "zakura-pir-protocol/http-endpoint",
    "dep:zcash_protocol",
    "dep:transparent",
    "dep:same-file",
    "dep:rustix",
]
wallet = ["dep:zcash_client_backend", "dep:zcash_primitives", "dep:zcash_protocol"]
transparent-wallet = ["wallet", "recovery", "zcash_client_backend/transparent-inputs"]
sqlite = ["transparent-wallet", "dep:zcash_client_sqlite"]
# Typed network steps consumed by the wallet recovery queue.
receiver-wallet = [
    "receiver",
    "wallet",
    "zakura-pir-protocol/receiver-crypto",
    "zcash_client_backend/orchard",
]
reqwest = ["dep:reqwest"]
lightwalletd = [
    "status",
    "dep:zcash_client_backend",
    "zcash_client_backend/lightwalletd-tonic",
    "zcash_client_backend/lightwalletd-tonic-transport",
    "dep:zcash_primitives",
    "dep:tonic",
    "dep:tokio",
]
testing = [
    "dep:zakura-pir-publisher",
    "dep:zakura-pir-query-server",
    "dep:zakura-pir-server-core",
    "dep:orchard",
    "dep:zcash_note_encryption",
    "dep:rand_10",
    "dep:axum",
]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
zakura-pir-publisher = { path = "../pir-publisher", version = "=0.0.1-rc4", optional = true }
zakura-pir-query-server = { path = "../pir-query-server", version = "=0.0.1-rc4", optional = true, features = ["testing"] }
zakura-pir-server-core = { path = "../pir-server-core", version = "=0.0.1-rc4", optional = true }
zcash_client_backend = { workspace = true, optional = true }
zcash_primitives = { workspace = true, optional = true }
zcash_protocol = { workspace = true, optional = true }
orchard = { workspace = true, optional = true, features = ["zip32-addresses"] }
zcash_note_encryption = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true }
base64 = { version = "0.22", optional = true }
hex = { version = "0.4", optional = true }
rand = { version = "0.8", optional = true }
rand_10 = { package = "rand", version = "0.10", optional = true, features = ["thread_rng"] }
rand_chacha = { workspace = true, optional = true }
reinspiring = { version = "=0.1.3-rc.1", git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2", optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
thiserror = { version = "2", optional = true }
zcash_client_sqlite = { version = "0.1.0-rc9.5", path = "../../librustzcash/zcash_client_sqlite", package = "zakura-client-sqlite", optional = true, features = ["transparent-inputs"] }
transparent = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
same-file = { version = "1.0.6", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
axum = { version = "0.7", optional = true }
tonic = { workspace = true, optional = true, features = ["transport"] }
tokio = { workspace = true, optional = true, features = ["time"] }
zakura-pir-protocol = { path = "../pir-protocol", version = "=0.0.1-rc4", optional = true }

[dev-dependencies]
ipir-native-client = { version = "=0.1.0-rc.1", git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2" }
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
zcash_client_sqlite = { package = "zakura-client-sqlite", path = "../../librustzcash/zcash_client_sqlite", version = "0.1.0-rc9.5", features = ["orchard", "test-dependencies", "transparent-inputs", "unstable"] }
zcash_client_backend = { workspace = true, features = ["orchard", "test-dependencies"] }
incrementalmerkletree = { workspace = true }
futures = "0.3"
inspiring = { version = "=0.1.0-rc.3", git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2" }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util", "time"] }
tempfile = "3"
serde_json = { workspace = true }
zcash_keys = { workspace = true, features = ["transparent-inputs"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
axum = "0.7"
regex = { workspace = true, features = ["std"] }
tower = { version = "0.5", features = ["util"] }
hex = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
rand = "0.8"
rand_chacha = { workspace = true }
flate2 = "1"
ipir-sp = { version = "=0.1.0-rc.7", git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2" }
orchard = { workspace = true }
zcash_primitives = { workspace = true }
clap = { version = "4", features = ["derive"] }
zakura-pir-query-server = { path = "../pir-query-server", version = "=0.0.1-rc4", features = ["transparent", "enhance", "status", "receiver", "testing"] }
zakura-pir-publisher = { path = "../pir-publisher", version = "=0.0.1-rc4", features = ["transparent", "enhance", "status", "receiver-crypto"] }
zakura-pir-server-core = { path = "../pir-server-core", version = "=0.0.1-rc4", features = ["transparent"] }

[target."cfg(unix)".dependencies]
rustix = { version = "1", optional = true, default-features = false, features = ["std", "fs"] }

[[test]]
name = "transparent_engine_store_schema_upgrade"
path = "tests/transparent/engine_store_schema_upgrade.rs"
required-features = ["transparent", "engine-store", "engine-conformance"]

[[test]]
name = "transparent_engine_store_semantics"
path = "tests/transparent/engine_store_semantics.rs"
required-features = ["transparent", "engine-store", "engine-conformance"]

[[test]]
name = "transparent_engine_birthday_to_balance"
path = "tests/transparent/engine_birthday_to_balance.rs"
required-features = ["transparent"]

[[test]]
name = "transparent_private_recovery"
path = "tests/transparent/private_recovery.rs"
required-features = ["transparent", "sqlite", "testing", "reqwest"]

[[test]]
name = "transparent_private_discovery"
path = "tests/transparent/private_discovery.rs"
required-features = ["transparent-wallet", "transparent", "testing", "reqwest"]

[[test]]
name = "transparent_engine_cache_pruning"
path = "tests/transparent/engine_cache_pruning.rs"
required-features = ["transparent-wallet", "transparent", "testing", "reqwest"]

[[test]]
name = "transparent_detail_run"
path = "tests/transparent/detail_run.rs"
required-features = ["transparent-wallet", "transparent", "testing"]

[[test]]
name = "enhance_protocol_contract"
path = "tests/enhance/protocol_contract.rs"
required-features = ["enhance"]

[[test]]
name = "native_golden"
path = "tests/native/golden.rs"
required-features = ["native"]

[[test]]
name = "native_dithered"
path = "tests/native/dithered.rs"
required-features = ["native"]

[[test]]
name = "native_p8"
path = "tests/native/p8.rs"
required-features = ["native"]

[[test]]
name = "transparent_filter_bip158_vectors"
path = "tests/transparent_filter/bip158_vectors.rs"
required-features = ["transparent", "reqwest"]

[[test]]
name = "transparent_filter_golden_envelope"
path = "tests/transparent_filter/golden_envelope.rs"
required-features = ["transparent", "reqwest"]

[[test]]
name = "transparent_filter_independent_crosscheck"
path = "tests/transparent_filter/independent_crosscheck.rs"
required-features = ["transparent", "reqwest"]

[[test]]
name = "transparent_txid_client_map_bytes"
path = "tests/transparent_txid_client/map_bytes.rs"
required-features = ["transparent", "testing"]

[[test]]
name = "transparent_previous_companion"
path = "tests/transparent/previous_companion.rs"
required-features = ["recovery"]

[[test]]
name = "receiver_golden"
path = "tests/receiver/golden.rs"
required-features = ["receiver"]

[[test]]
name = "receiver_inventory"
path = "tests/receiver/inventory.rs"
required-features = ["receiver"]

[[test]]
name = "receiver_inventory_cache"
path = "tests/receiver/inventory_cache.rs"
required-features = ["receiver"]

[[test]]
name = "receiver_block_transport"
path = "tests/receiver/block_transport.rs"
required-features = ["receiver"]

[[test]]
name = "receiver_discovery"
path = "tests/receiver/discovery.rs"
required-features = ["receiver-wallet"]

[[example]]
name = "transparent_recover-activity"
path = "examples/transparent/recover-activity.rs"
required-features = ["transparent", "sqlite"]

[[example]]
name = "transparent_engine-store-reopen"
path = "examples/transparent/engine-store-reopen.rs"
required-features = ["transparent", "engine-store"]

[[example]]
name = "transparent_recovery-without-backend"
path = "examples/transparent/recovery-without-backend.rs"
required-features = ["transparent", "recovery"]

[[example]]
name = "transparent_txid_client_txid-quality-canary"
path = "examples/transparent_txid_client/txid-quality-canary.rs"
