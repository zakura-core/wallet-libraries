[package]
name = "zakura-pir-transparent"
version = "0.0.1-rc0"
description = "Bounded reference transparent PIR recovery into candidate wallet evidence"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
keywords = ["zcash", "privacy", "pir"]

[features]
default = []
# Applying a batch to a SQLite wallet and acknowledging it in one call.
sqlite = ["wallet", "dep:zcash_client_sqlite"]
wallet = ["dep:zcash_client_backend", "dep:zcash_primitives", "dep:zcash_protocol", "dep:transparent", "dep:transparent-wallet", "dep:transparent-wallet-store", "dep:transparent-events", "dep:transparent-filter", "dep:transparent-txid-client", "dep:rusqlite", "dep:hex", "dep:serde_json"]

[dependencies]
zcash_client_backend = { workspace = true, optional = true, features = ["transparent-inputs"] }
zcash_client_sqlite = { version = "0.1.0-rc7", path = "../../librustzcash/zcash_client_sqlite", package = "zakura-client-sqlite", optional = true, features = ["transparent-inputs"] }
zcash_primitives = { workspace = true, optional = true }
zcash_protocol = { workspace = true, optional = true }
transparent = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
sha2.workspace = true
serde_json = { workspace = true, optional = true }
thiserror = "2"
url = "2"
transparent-wallet = { git = "https://github.com/valargroup/wallet-pir", rev = "e9f128b4bcb58dd679c282a5bec3856e93518d4d", optional = true }
transparent-wallet-store = { git = "https://github.com/valargroup/wallet-pir", rev = "e9f128b4bcb58dd679c282a5bec3856e93518d4d", optional = true }
transparent-events = { git = "https://github.com/valargroup/wallet-pir", rev = "e9f128b4bcb58dd679c282a5bec3856e93518d4d", optional = true }
transparent-filter = { git = "https://github.com/valargroup/wallet-pir", rev = "e9f128b4bcb58dd679c282a5bec3856e93518d4d", optional = true }
transparent-txid-client = { git = "https://github.com/valargroup/wallet-pir", rev = "e9f128b4bcb58dd679c282a5bec3856e93518d4d", optional = true }

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
zcash_client_sqlite = { path = "../../librustzcash/zcash_client_sqlite", package = "zakura-client-sqlite", features = ["orchard", "transparent-inputs", "test-dependencies", "unstable"] }
zcash_client_backend = { workspace = true, features = ["orchard", "test-dependencies"] }
zcash_keys = { workspace = true, features = ["transparent-inputs"] }
# The example and the end-to-end test build the reference HTTP adapters; the
# library takes caller transports.
transparent-wallet = { git = "https://github.com/valargroup/wallet-pir", rev = "e9f128b4bcb58dd679c282a5bec3856e93518d4d", features = ["reqwest"] }
# The end-to-end test publishes shards and serves them in process; it requires
# `wallet`, which brings the event and filter crates.
transparent-shard = { git = "https://github.com/valargroup/wallet-pir", rev = "e9f128b4bcb58dd679c282a5bec3856e93518d4d" }
transparent-shard-server = { git = "https://github.com/valargroup/wallet-pir", rev = "e9f128b4bcb58dd679c282a5bec3856e93518d4d" }
axum = "0.7"
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
regex = { workspace = true, features = ["std"] }
# The txid display end-to-end test drives the in-process server's router directly.
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "recover-activity"
required-features = ["wallet"]

[[test]]
name = "private_recovery"
required-features = ["sqlite"]
