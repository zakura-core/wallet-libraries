[package]
name = "zakura-pir-transparent"
version = "0.0.1-rc1"
description = "Bounded reference transparent PIR recovery into candidate wallet evidence"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
keywords = ["zcash", "privacy", "pir"]

[features]
default = []
# Applying a batch to a SQLite wallet and acknowledging it in one call.
sqlite = ["wallet", "dep:zcash_client_sqlite"]
wallet = ["dep:zcash_client_backend", "dep:zcash_primitives", "dep:zcash_protocol", "dep:transparent", "dep:transparent-wallet", "dep:transparent-wallet-store", "dep:transparent-events", "dep:transparent-filter", "dep:transparent-txid-client", "dep:rusqlite", "dep:hex", "dep:serde_json", "dep:same-file", "dep:rustix"]
# Test support for applications: batches no companion issued, their settlement and
# a fake txid display publication. Never enable it in a production build. A real
# shard service in process is wallet-pir's, which serves these crates.
testing = ["wallet", "dep:transparent-shard", "dep:transparent-native", "dep:base64"]

[dependencies]
zcash_client_backend = { workspace = true, optional = true, features = ["transparent-inputs"] }
zcash_client_sqlite = { version = "0.1.0-rc9", path = "../../librustzcash/zcash_client_sqlite", package = "zakura-client-sqlite", optional = true, features = ["transparent-inputs"] }
zcash_primitives = { workspace = true, optional = true }
zcash_protocol = { workspace = true, optional = true }
transparent = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
sha2.workspace = true
serde_json = { workspace = true, optional = true }
same-file = { version = "1.0.6", optional = true }
base64 = { workspace = true, optional = true }
thiserror = "2"
url = "2"
# The transparent PIR client, store and protocol crates, owned here.
transparent-wallet = { package = "zakura-pir-transparent-wallet", version = "=0.0.1-rc0", path = "../pir-transparent-wallet", optional = true }
transparent-wallet-store = { package = "zakura-pir-transparent-wallet-store", version = "=0.0.1-rc0", path = "../pir-transparent-wallet-store", optional = true }
transparent-events = { package = "zakura-pir-transparent-events", version = "=0.0.1-rc0", path = "../pir-transparent-events", optional = true }
transparent-filter = { package = "zakura-pir-transparent-filter", version = "=0.0.1-rc0", path = "../pir-transparent-filter", optional = true }
transparent-txid-client = { package = "zakura-pir-transparent-txid-client", version = "=0.0.1-rc0", path = "../pir-transparent-txid-client", optional = true }
transparent-shard = { package = "zakura-pir-transparent-shard", version = "=0.0.1-rc0", path = "../pir-transparent-shard", optional = true }
transparent-native = { package = "zakura-pir-transparent-native", version = "=0.0.1-rc0", path = "../pir-transparent-native", optional = true }

# Companion locks: `flock` directly, which `std` supports on Android only from Rust 1.98.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", optional = true, default-features = false, features = ["std", "fs"] }

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
zcash_client_sqlite = { version = "0.1.0-rc9", path = "../../librustzcash/zcash_client_sqlite", package = "zakura-client-sqlite", features = ["orchard", "transparent-inputs", "test-dependencies", "unstable"] }
zcash_client_backend = { workspace = true, features = ["orchard", "test-dependencies"] }
zcash_keys = { workspace = true, features = ["transparent-inputs"] }
# The example reads the service's init and manifests, and runs discovery, through
# the reference HTTP adapters; the library takes caller transports.
transparent-wallet = { package = "zakura-pir-transparent-wallet", version = "=0.0.1-rc0", path = "../pir-transparent-wallet", features = ["reqwest"] }
# The example's `HttpExchange`: one blocking request at a time, the client the
# reference HTTP adapters above already build.
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }

[[example]]
name = "recover-activity"
required-features = ["sqlite"]

[[test]]
name = "detail_run"
required-features = ["testing"]
