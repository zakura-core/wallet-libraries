[package]
name = "zakura-pir-transparent"
version = "0.0.1-rc0"
description = "Bounded reference transparent PIR recovery into candidate wallet evidence"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
keywords = ["zcash", "privacy", "pir"]

[features]
default = []
wallet = ["dep:zcash_client_backend", "dep:zcash_primitives", "dep:zcash_protocol", "dep:transparent", "dep:transparent-wallet", "dep:transparent-wallet-store", "dep:transparent-events", "dep:transparent-filter", "dep:rusqlite", "dep:hex", "dep:serde_json"]

[dependencies]
zcash_client_backend = { workspace = true, optional = true, features = ["transparent-inputs"] }
zcash_primitives = { workspace = true, optional = true }
zcash_protocol = { workspace = true, optional = true }
transparent = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
sha2.workspace = true
serde_json = { workspace = true, optional = true }
thiserror = "2"
url = "2"
transparent-wallet = { git = "https://github.com/valargroup/wallet-pir", rev = "648264bb4801ae8faf7a61f4638ea049edb167cf", optional = true }
transparent-wallet-store = { git = "https://github.com/valargroup/wallet-pir", rev = "648264bb4801ae8faf7a61f4638ea049edb167cf", optional = true }
transparent-events = { git = "https://github.com/valargroup/wallet-pir", rev = "648264bb4801ae8faf7a61f4638ea049edb167cf", optional = true }
transparent-filter = { git = "https://github.com/valargroup/wallet-pir", rev = "648264bb4801ae8faf7a61f4638ea049edb167cf", optional = true }

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
zcash_client_sqlite = { path = "../../librustzcash/zcash_client_sqlite", package = "zakura-client-sqlite", features = ["orchard", "transparent-inputs", "test-dependencies", "unstable"] }
zcash_client_backend = { workspace = true, features = ["orchard", "test-dependencies"] }
zcash_keys = { workspace = true, features = ["transparent-inputs"] }
# The example and the end-to-end test build the reference HTTP adapters; the
# library takes caller transports.
transparent-wallet = { git = "https://github.com/valargroup/wallet-pir", rev = "648264bb4801ae8faf7a61f4638ea049edb167cf", features = ["reqwest"] }
# The end-to-end test publishes shards and serves them in process; it requires
# `wallet`, which brings the event and filter crates.
transparent-shard = { git = "https://github.com/valargroup/wallet-pir", rev = "648264bb4801ae8faf7a61f4638ea049edb167cf" }
transparent-shard-server = { git = "https://github.com/valargroup/wallet-pir", rev = "648264bb4801ae8faf7a61f4638ea049edb167cf" }
axum = "0.7"
# The mixed shielding qualification authors serialized transactions and serves
# their Enhance PIR records over the native protocol.
base64.workspace = true
incrementalmerkletree.workspace = true
orchard = { workspace = true, features = ["circuit"] }
rand = { workspace = true, features = ["std_rng"] }
sapling = { workspace = true, features = ["test-dependencies"] }
secp256k1.workspace = true
transparent = { workspace = true, features = ["transparent-inputs"] }
zakura-pir-enhance = { path = "../pir-enhance", features = ["wallet"] }
zakura-pir-native = { path = "../pir-native", features = ["test-server"] }
zcash_primitives = { workspace = true, features = ["std", "circuits", "transparent-inputs"] }
zcash_protocol = { workspace = true, features = ["local-consensus"] }
zip32.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
regex = { workspace = true, features = ["std"] }

[[example]]
name = "recover-activity"
required-features = ["wallet"]

[[test]]
name = "private_recovery"
required-features = ["wallet"]

[[test]]
name = "mixed_shielding"
required-features = ["wallet"]
