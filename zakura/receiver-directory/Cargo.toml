[package]
readme = "README.md"
name = "zakura-receiver-directory"
version = "0.0.1-rc0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license = "MIT"
description = "Publicly recoverable Ironwood receiver directory and private lookup records"

[features]
test-support = ["dep:hex"]

[dependencies]
# Pinned exactly, as in `transparent-filter`: the filter bytes are what every wallet
# tests, so the encoder may not move without revalidation.
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
incrementalmerkletree.workspace = true
orchard.workspace = true
zcash_note_encryption.workspace = true
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = { version = "0.4", optional = true }

[dev-dependencies]
orchard = { workspace = true, features = ["zip32-addresses"] }
incrementalmerkletree = { workspace = true, features = ["legacy-api"] }
hex = "0.4"
tempfile = "3"

[lib]
name = "receiver_directory"
