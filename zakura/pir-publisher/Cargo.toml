[package]
name = "zakura-pir-publisher"
version = "0.0.1-rc4"
edition = "2024"
description = "PIR publication construction without request evaluation"
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Product and capability features are explicit; no product is enabled by default.
default = []
enhance = ["zakura-pir-protocol/enhance"]
receiver = ["zakura-pir-protocol/receiver", "dep:sha2"]
# Lower inclusion paths for companion witness tables, which hash with Orchard.
receiver-crypto = [
    "receiver",
    "zakura-pir-protocol/receiver-crypto",
    "dep:incrementalmerkletree",
    "dep:orchard",
]
status = ["zakura-pir-protocol/status"]
transparent = [
    "dep:hex",
    "dep:sha2",
    "dep:thiserror",
    "zakura-pir-protocol/transparent",
    "zakura-pir-server-core/transparent",
]

[dependencies]
zakura-pir-protocol = { path = "../pir-protocol", version = "=0.0.1-rc4", features = ["native"] }
zakura-pir-server-core = { path = "../pir-server-core", version = "=0.0.1-rc4" }
hex = { version = "0.4", optional = true }
sha2 = { version = "0.10", optional = true }
thiserror = { version = "2", optional = true }
incrementalmerkletree = { workspace = true, optional = true }
orchard = { workspace = true, optional = true }

[dev-dependencies]
zakura-pir-protocol = { path = "../pir-protocol", version = "=0.0.1-rc4", features = ["filter-matching"] }
hex = { workspace = true }
sha2 = { workspace = true }
incrementalmerkletree = { workspace = true, features = ["legacy-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }

[[test]]
name = "receiver_directory"
path = "tests/receiver/directory.rs"
required-features = ["receiver"]

[[test]]
name = "receiver_witness"
path = "tests/receiver/witness.rs"
required-features = ["receiver"]

[[test]]
name = "receiver_shard_paths"
path = "tests/receiver/shard_paths.rs"
required-features = ["receiver-crypto"]

[[example]]
name = "transparent_shard_layout_census"
path = "examples/transparent_shard/layout_census.rs"
required-features = ["transparent"]
