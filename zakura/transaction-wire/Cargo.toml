[package]
name = "zakura-transaction-wire"
description = "Experimental borrowed reader for the Zcash transaction wire format (prototype, unpublished)"
version = "0.1.0"
# Authors of the Common prototype this crate was moved from.
authors = [
    "Dev Ojha <ValarDragon@users.noreply.github.com>",
    "Sean Bowe <ewillbefull@gmail.com>",
]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Prototype: this crate is not published and is not a supported API yet.
publish = false

[lib]
name = "zcash_transaction_wire"

# Normal dependencies are deliberately limited to the protocol constants and
# value types plus the two hash libraries the transaction IDs need. No Sapling,
# Orchard, Halo2, primitives, node, or wallet crate may appear here; the
# dependency test in tests/dependencies.rs enforces this.
[dependencies]
blake2b_simd = { version = "1", default-features = false }
sha2 = { version = "0.10", default-features = false }
# The wire reader uses protocol APIs available since RC1. Keep it consumable by
# services pinned to that protocol family while allowing current Common releases.
zcash_protocol = { package = "zakura-protocol", version = "=5.0.0", git = "https://github.com/zakura-core/common.git", rev = "26fb46d9110092f07cc682f16d4678b01fb915df", default-features = false }

# The existing typed decoder is the differential oracle. It is only a test
# dependency, so it never enters a normal consumer's dependency graph.
[dev-dependencies]
hex = "0.4"
orchard.workspace = true
proptest = ">=1,<1.7"
zcash_primitives = { workspace = true, features = ["backend-halo2", "std", "test-dependencies"] }
zcash_protocol = { workspace = true, features = ["std"] }
