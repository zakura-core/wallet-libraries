[package]
name = "zakura-pir-enhance-types"
version = "0.0.1-rc1"
description = "Wire record types for private Ironwood enhancement"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
keywords = ["zcash", "privacy", "pir"]

[features]
# Configured HTTP endpoint types shared by the PIR clients. Record-only users
# do not enable this feature or resolve the HTTP URI parser.
http-endpoint = ["dep:http"]

[dependencies]
http = { version = "1", optional = true }

[dev-dependencies]
# Independent oracle for the conventional endpoint syntax accepted by the clients.
url = "2"

[lints]
workspace = true
