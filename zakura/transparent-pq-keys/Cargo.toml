[package]
name = "transparent-pq-keys"
version = "0.1.0"
description = "Experimental deterministic SLH-DSA transparent wallet key lifecycle"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
# The derivation is versioned for reproducible experiments, not released wallet use.
publish = false

[dependencies]
hkdf = { version = "0.12.4", default-features = false }
sha2.workspace = true
# Match Common's PQ primitive implementation until its API is released.
slh-dsa = { version = "=0.2.0-rc.5", default-features = false, features = ["zeroize"] }
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[lints]
workspace = true
