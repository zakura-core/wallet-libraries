[package]
name = "zakura-pir-status"
version = "0.0.1-rc0"
description = "Private transaction-status PIR protocol and client for Zakura wallets"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
keywords = ["zcash", "privacy", "pir"]

[dependencies]
hex.workspace = true
rand = "0.8"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror = "2"
zakura-pir-native = { version = "0.0.1-rc0", path = "../pir-native" }

[dev-dependencies]
zakura-pir-native = { version = "0.0.1-rc0", path = "../pir-native", features = ["test-server"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
