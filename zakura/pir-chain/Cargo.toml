[package]
name = "zakura-server-chain"
version = "0.0.1-rc0"
publish = false
description = "Zakura node reads and chain interpretation for the PIR services"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
# Consumers select the adapter they use; transport and hash helpers stay shared.
default = []
transparent = []
enhance = []
status = []
receiver = ["dep:zakura-receiver-crypto"]
## Synthetic chain fixtures for service tests: raw blocks and transactions built
## with the node's own encoders.
testing = ["dep:axum", "dep:zakura-chain", "tokio/net", "tokio/time"]
## Reading the node's RocksDB directly, as a secondary instance; see
## `transparent::state`.
rocksdb = ["transparent", "dep:zakura-state", "dep:zakura-chain"]

[dependencies]
axum = { version = "0.7", optional = true }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
zakura-chain = { workspace = true, optional = true }
sha2 = "0.10"
zcash_script = "0.6"
zcash_primitives = { package = "zakura-primitives", version = "=4.0.0-rc1", default-features = false, features = ["std", "backend-halo2"], git = "https://github.com/zakura-core/common.git", rev = "7c6982448b5d52bf16d1c769bbd61551564f55bb" }
zcash_protocol = { package = "zakura-protocol", version = "=4.0.0-rc1", git = "https://github.com/zakura-core/common.git", rev = "7c6982448b5d52bf16d1c769bbd61551564f55bb" }
transparent = { package = "zakura-transparent", version = "=4.0.0-rc1", default-features = false, features = ["std"], git = "https://github.com/zakura-core/common.git", rev = "7c6982448b5d52bf16d1c769bbd61551564f55bb" }
orchard = { package = "zakura-orchard", version = "=4.0.0-rc1", default-features = false, features = ["std", "backend-halo2"], git = "https://github.com/zakura-core/common.git", rev = "7c6982448b5d52bf16d1c769bbd61551564f55bb" }
zakura-state = { workspace = true, optional = true }
zakura-receiver-crypto = { path = "../receiver-crypto", optional = true }

[dev-dependencies]
axum = "0.7"
chrono = { version = "0.4", default-features = false }
hex = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
# Independent node decoding and historical block vectors for RPC compatibility tests.
zakura-chain.workspace = true
zakura-test.workspace = true

[[test]]
name = "enhance"
required-features = ["testing", "enhance"]

[[test]]
name = "receiver"
required-features = ["testing", "receiver"]

[[test]]
name = "status"
required-features = ["testing", "status"]

[[test]]
name = "transparent"
required-features = ["testing", "transparent"]

[[test]]
name = "state"
required-features = ["testing", "rocksdb"]

# Server-only adapters between Zakura node data and the PIR services.
#
# This is its own workspace, with its own lockfile, so that no wallet build in the
# repository root workspace ever resolves the node's packages. Only PIR servers and
# their tools depend on it; it may use the wallet-owned crates under `zakura/`
# by path, never the other way round.
[workspace]
resolver = "2"
members = ["."]

[workspace.package]
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/zakura-core/wallet-libraries"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Common RC1 support from https://github.com/zakura-core/zakura/pull/1542.
# Changing this revision does not upgrade a
# deployed node; a direct database reader must match the running node's format.
zakura-chain = { git = "https://github.com/zakura-core/zakura.git", rev = "dcff84dc42258bb1e4c5d368094e11ea27c7ed4f" }
# Pinned to the same revision as `zakura-chain`, and it must stay that way: the
# `rocksdb` reader opens the node's database directly, so its format must match
# the running node's.
zakura-state = { git = "https://github.com/zakura-core/zakura.git", rev = "dcff84dc42258bb1e4c5d368094e11ea27c7ed4f" }
# Test vectors from the same node revision.
zakura-test = { git = "https://github.com/zakura-core/zakura.git", rev = "dcff84dc42258bb1e4c5d368094e11ea27c7ed4f" }
