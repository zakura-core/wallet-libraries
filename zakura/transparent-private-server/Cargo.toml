[package]
name = "zakura-transparent-private-server"
version = "0.0.1-rc0"
# The filter and shard builders moved from wallet-pir at edition 2021 and
# compile unchanged under it.
edition = "2021"
description = "Transparent private-mode publisher: filter and shard construction, sealing, txid display tables, and the native operations that answer queries"
rust-version.workspace = true
license = "MIT"
repository.workspace = true
readme = "README.md"
categories.workspace = true
keywords = ["zcash", "privacy", "pir"]

[features]
default = []
# An in-process shard service over a synthetic publication, for wallet and
# application tests. Never enable it in a production build.
testing = ["dep:axum"]

[dependencies]
base64 = "0.22"
# Pinned exactly: the filter bytes this crate produces are consensus-visible to
# every wallet that caches them, so the encoder may not move without a
# deliberate revalidation against the committed vectors.
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
hex = { workspace = true, features = ["std"] }
rayon.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
sha2.workspace = true
thiserror = "2"
zakura-pir-native = { version = "=0.0.1-rc2", path = "../pir-native", features = ["server"] }
zakura-transparent-private-shared = { version = "=0.0.1-rc0", path = "../transparent-private-shared" }
axum = { version = "0.7", optional = true }

[dev-dependencies]
ipir-sp = { version = "=0.1.0-rc.7", features = ["native-reinspiring"] }
rand = "0.8"
rand_chacha.workspace = true
serde_json.workspace = true

[[example]]
name = "layout_census"
