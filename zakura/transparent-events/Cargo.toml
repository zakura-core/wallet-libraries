[package]
name = "zakura-transparent-events"
version = "0.0.1-rc0"
# Kept at 2021 from wallet-pir so the moved code compiles unchanged.
edition = "2021"
description = "Transparent PIR event records and codecs shared by the publisher, server and wallet"
rust-version.workspace = true
license = "MIT"
repository.workspace = true
readme = "README.md"
categories.workspace = true
keywords = ["zcash", "privacy", "pir"]

[lib]
# The library keeps wallet-pir's crate name, so `transparent_events::` paths
# are unchanged for its consumers.
name = "transparent_events"
path = "src/lib.rs"

[dependencies]
hex = "0.4"
thiserror = "2"
