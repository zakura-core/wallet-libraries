[package]
name = "zakura-pir-transparent-native"
version = "0.0.1-rc0"
edition = "2021"
rust-version.workspace = true
description = "Transparent's native ReinspiRING two-mask m29 PIR profile, shared by the shard server and the wallet"
license = "MIT"
repository.workspace = true

[lib]
name = "transparent_native"
path = "src/lib.rs"

[dependencies]
hex = "0.4"
pir-native = { package = "zakura-pir-native", version = "=0.0.1-rc1", path = "../pir-native" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
ipir-sp = { version = "=0.1.0-rc.7", features = ["native-reinspiring"] }
rand = "0.8"
rand_chacha = "0.3"
