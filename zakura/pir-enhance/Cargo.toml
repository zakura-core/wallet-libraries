[package]
name = "zakura-pir-enhance"
version = "0.0.1-rc1"
description = "Private Ironwood compact-action enhancement client for Zakura wallets"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
keywords = ["zcash", "privacy", "pir"]

[lib]
name = "zakura_pir_enhance"

[features]
default = []
wallet = ["dep:zcash_client_backend", "dep:zcash_primitives", "dep:zcash_protocol"]

[dependencies]
zcash_client_backend = { workspace = true, optional = true }
zcash_primitives = { workspace = true, optional = true }
zcash_protocol = { workspace = true, optional = true }
futures-util = "0.3"
url = "2"
base64 = "0.22"
hex.workspace = true
ipir-sp = { version = "0.1.0-rc.6", features = ["native-reinspiring"] }
rand = "0.8"
rand_chacha.workspace = true
reinspiring = "0.1.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror = "2"
zakura-pir-enhance-types = { version = "0.0.1-rc0", path = "../pir-enhance-types" }
zakura-pir-native = { version = "0.0.1-rc0", path = "../pir-native" }

[dev-dependencies]
zakura-pir-native = { version = "0.0.1-rc0", path = "../pir-native", features = ["test-server"] }
zcash_client_sqlite = { package = "zakura-client-sqlite", path = "../../librustzcash/zcash_client_sqlite", version = "0.1.0-rc7", features = ["orchard", "test-dependencies"] }
zcash_client_backend = { workspace = true, features = ["orchard", "test-dependencies"] }
incrementalmerkletree.workspace = true
futures = "0.3"
inspiring = "0.1.0-rc.2"
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
