[package]
name = "zakura-pir-enhance"
version = "0.0.1-rc0"
description = "Private Ironwood compact-action enhancement client for Zakura wallets"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
keywords = ["zcash", "privacy", "pir"]

[lib]
name = "zakura_pir_enhance"

[features]
default = ["https-client"]
https-client = ["dep:reqwest"]
wallet = ["dep:zcash_client_backend", "dep:zcash_primitives", "dep:zcash_protocol"]
## Experimental: speak the native two-mask v9 protocol
## (`ironwood-enhance-pir-v9-native-two-mask-m29`) instead of v7. Compile-time
## selection; a build with this feature cannot talk to a v7 server.
native-reinspiring = ["dep:reinspiring", "dep:rand_chacha", "ipir-sp/native-reinspiring"]

[dependencies]
zcash_client_backend = { workspace = true, optional = true, features = ["zakura-pir-enhance"] }
zcash_primitives = { workspace = true, optional = true }
zcash_protocol = { workspace = true, optional = true }
futures-util = "0.3"
url = "2"
base64 = "0.22"
hex.workspace = true
ipir-sp = { git = "https://github.com/valargroup/ipir-sp.git", tag = "v0.1.0-rc.6" }
rand = "0.8"
rand_chacha = { workspace = true, optional = true }
reinspiring = { git = "https://github.com/valargroup/ipir-sp.git", tag = "v0.1.0-rc.6", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror = "2"
zakura-pir-enhance-types = { version = "=0.0.1-rc0", path = "../pir-enhance-types" }

[dev-dependencies]
zcash_client_sqlite = { package = "zakura-client-sqlite", path = "../../librustzcash/zcash_client_sqlite", version = "0.1.0-rc6", features = ["zakura-pir-enhance", "test-dependencies"] }
zcash_client_backend = { workspace = true, features = ["zakura-pir-enhance", "test-dependencies"] }
incrementalmerkletree.workspace = true
futures = "0.3"
inspiring = "=0.1.0-rc.1"
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
