[package]
name = "zakura-pir-enhance"
version = "0.1.0"
description = "Private Ironwood compact-action enhancement client for Zakura wallets"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "zakura_pir_enhance"

[features]
default = ["https-client"]
https-client = ["dep:reqwest"]
wallet-integration = ["dep:zcash_client_backend"]

[dependencies]
base64 = "0.22"
hex.workspace = true
ipir-sp = { git = "https://github.com/valargroup/ipir-sp.git", rev = "accc424e879d8da425fa620aad80f0f2c4e0defd" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror = "2"
zcash_client_backend = { workspace = true, optional = true, features = ["zakura-pir-enhance"] }

[dev-dependencies]
inspiring = { git = "https://github.com/valargroup/ipir-sp.git", rev = "accc424e879d8da425fa620aad80f0f2c4e0defd" }
