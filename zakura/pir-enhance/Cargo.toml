[package]
name = "zakura-pir-enhance"
version = "0.0.1-rc4"
description = "Private Ironwood compact-action enhancement client for Zakura wallets"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
keywords = ["zcash", "privacy", "pir"]

[lib]
name = "zakura_pir_enhance"

[features]
default = []
wallet = ["dep:zcash_client_backend", "dep:zcash_primitives", "dep:zcash_protocol"]
# Synthetic Ironwood output fixture for tests of the PIR record path.
testing = ["dep:orchard", "dep:zcash_note_encryption", "dep:rand_10"]

[dependencies]
zcash_client_backend = { workspace = true, optional = true }
zcash_primitives = { workspace = true, optional = true }
zcash_protocol = { workspace = true, optional = true }
orchard = { workspace = true, optional = true, features = ["zip32-addresses"] }
zcash_note_encryption = { workspace = true, optional = true }
futures-util = "0.3"
base64 = "0.22"
hex.workspace = true
ipir-sp = { version = "=0.1.0-rc.7", git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2", features = ["native-reinspiring"] }
rand = "0.8"
rand_10 = { package = "rand", version = "0.10", optional = true, features = ["thread_rng"] }
rand_chacha.workspace = true
reinspiring = { version = "=0.1.3-rc.1", git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror = "2"
zakura-pir-enhance-types = { version = "=0.0.1-rc1", path = "../pir-enhance-types", features = ["http-endpoint"] }
zakura-pir-native = { version = "=0.0.1-rc2", path = "../pir-native" }

[dev-dependencies]
zakura-pir-native = { version = "=0.0.1-rc2", path = "../pir-native", features = ["test-server"] }
zcash_client_sqlite = { package = "zakura-client-sqlite", path = "../../librustzcash/zcash_client_sqlite", version = "0.1.0-rc9", features = ["orchard", "test-dependencies"] }
zcash_client_backend = { workspace = true, features = ["orchard", "test-dependencies"] }
incrementalmerkletree.workspace = true
futures = "0.3"
inspiring = { version = "=0.1.0-rc.3", git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2" }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
