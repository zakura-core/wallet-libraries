[package]
name = "zakura-pir-query-server"
version = "0.0.1-rc5"
edition = "2024"
description = "PIR query evaluation without publication construction"
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Product and capability features are explicit; no product is enabled by default.
default = []
enhance = ["zakura-pir-protocol/enhance"]
receiver = ["zakura-pir-protocol/receiver", "dep:sha2"]
status = ["zakura-pir-protocol/status"]
transparent = ["zakura-pir-protocol/transparent", "zakura-pir-server-core/transparent"]
testing = []

[dependencies]
zakura-pir-protocol = { path = "../pir-protocol", version = "=0.0.1-rc5", features = ["native"] }
reinspiring = { version = "=0.1.3-rc.1" }
rayon = { workspace = true }
zakura-pir-server-core = { path = "../pir-server-core", version = "=0.0.1-rc5" }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
hex = { workspace = true }
serde_json = { workspace = true }
zakura-pir-publisher = { path = "../pir-publisher", version = "=0.0.1-rc5", features = ["receiver"] }
sha2 = { workspace = true }
