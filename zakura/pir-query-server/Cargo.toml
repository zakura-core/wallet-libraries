[package]
name = "zakura-pir-query-server"
version = "0.0.1-rc4"
edition = "2024"
description = "PIR query evaluation without publication construction"
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Product and capability features are explicit; no product is enabled by default.
default = []
enhance = ["zakura-pir-protocol/enhance"]
receiver = ["zakura-pir-protocol/receiver", "dep:sha2"]
status = ["zakura-pir-protocol/status"]
transparent = ["zakura-pir-protocol/transparent", "zakura-pir-server-core/transparent"]
testing = []

[dependencies]
zakura-pir-protocol = { path = "../pir-protocol", version = "=0.0.1-rc4", features = ["native"] }
reinspiring = { version = "=0.1.3-rc.1", git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2" }
rayon = { workspace = true }
zakura-pir-server-core = { path = "../pir-server-core", version = "=0.0.1-rc4" }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
ipir-sp = { version = "=0.1.0-rc.7", git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2" }
sha2 = { workspace = true }
