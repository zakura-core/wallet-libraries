[package]
name = "zakura-pir-transparent-shard"
version = "0.0.1-rc0"
edition = "2021"
rust-version.workspace = true
description = "Transparent PIR shard maps, manifests and table codecs"
license = "MIT"
repository.workspace = true

[lib]
name = "transparent_shard"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
transparent-events = { package = "zakura-pir-transparent-events", version = "=0.0.1-rc0", path = "../pir-transparent-events" }
transparent-filter = { package = "zakura-pir-transparent-filter", version = "=0.0.1-rc0", path = "../pir-transparent-filter" }
