[package]
name = "zakura-receiver-crypto"
version = "0.0.1-rc0"
description = "Receiver directory validation: addresses, zero-OVK recovery, records and inclusion proofs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = ["crypto"]
# Address, record and proof validation. The wire codec is available without this.
crypto = ["dep:incrementalmerkletree", "dep:orchard", "dep:zcash_address", "dep:zcash_note_encryption", "dep:zcash_protocol", "dep:thiserror"]

[dependencies]
incrementalmerkletree = { workspace = true, optional = true }
orchard = { workspace = true, optional = true }
zcash_address = { workspace = true, features = ["std"], optional = true }
zcash_note_encryption = { workspace = true, optional = true }
zcash_protocol = { workspace = true, optional = true }
thiserror = { version = "2", optional = true }

[dev-dependencies]
hex.workspace = true
incrementalmerkletree = { workspace = true, features = ["legacy-api"] }
orchard = { workspace = true, features = ["zip32-addresses"] }
serde_json.workspace = true
