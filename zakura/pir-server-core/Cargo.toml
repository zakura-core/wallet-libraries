[package]
name = "zakura-pir-server-core"
version = "0.0.1-rc5"
edition = "2024"
description = "Native preparation shared by PIR server roles"
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Product and capability features are explicit; no product is enabled by default.
default = []
transparent = []

[dependencies]
zakura-pir-protocol = { path = "../pir-protocol", version = "=0.0.1-rc5", features = ["native"] }
reinspiring = { version = "=0.1.3-rc.1" }
rayon = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
rand = "0.8"
rand_chacha = { workspace = true }
