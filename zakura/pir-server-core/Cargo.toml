
[package]
name = "zakura-pir-server-core"
version = "0.0.1-rc0"
edition = "2024"
description = "Native preparation shared by PIR server roles"

[package.rust-version]
workspace = true

[package.license]
workspace = true

[package.repository]
workspace = true

[features]
default = []
enhance = []
status = []
transparent = []

[dependencies]
zakura-pir-protocol = { path = "../pir-protocol", version = "=0.0.1-rc0", features = ["native"] }
ipir-native-client = { version = "=0.1.0-rc.1", git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2" }
reinspiring = { version = "=0.1.3-rc.1", git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2" }
rayon = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
rand = "0.8"
rand_chacha = { workspace = true }
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
