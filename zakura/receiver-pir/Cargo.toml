[package]
name = "zakura-receiver-pir"
version = "0.0.1-rc0"
# Kept at 2021 from wallet-pir so the moved code compiles unchanged.
edition = "2021"
description = "Receiver directory PIR: session manifests, the client, the wallet transport and the evaluator"
rust-version.workspace = true
license = "MIT"
repository.workspace = true
readme = "README.md"

[lib]
# The library keeps wallet-pir's crate name, so `receiver_pir::` paths are
# unchanged for its consumers.
name = "receiver_pir"
path = "src/lib.rs"

[features]
# The evaluator, which scans the rows with ipir-sp as Transparent's workers do.
server = ["dep:ipir-sp", "dep:zakura-pir-server-core", "dep:zakura-pir-query-server"]

[dependencies]
zakura-pir-server-core = { path = "../pir-server-core", version = "=0.0.1-rc0", optional = true }
zakura-pir-query-server = { path = "../pir-query-server", version = "=0.0.1-rc0", optional = true }
hex = "0.4"
receiver-directory = { package = "zakura-receiver-directory", version = "=0.0.1-rc0", path = "../receiver-directory" }
ipir-sp = { version = "=0.1.0-rc.7", git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2", optional = true }
zakura-pir-client = { path = "../pir-client", version = "=0.0.1-rc0", features = ["native"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
rand_chacha = "0.3"

[[test]]
name = "golden"
required-features = ["server"]
