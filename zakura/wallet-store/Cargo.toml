[package]
name = "zakura-wallet-store"
version = "0.1.0"
description = "SQLite storage for the Zakura wallet core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "zakura_wallet_store"

[features]
# Exposes helpers for opening throwaway in-memory wallets.
test-dependencies = []

[dependencies]
incrementalmerkletree.workspace = true
orchard.workspace = true
rusqlite.workspace = true
shardtree.workspace = true
# `transparent-inputs` is what compiles in `UnifiedFullViewingKey::transparent`
# and the BIP 32 derivation beneath it. Without it the wallet can hold a
# transparent key and be unable to derive a single address from it.
zcash_keys = { workspace = true, features = ["orchard", "transparent-inputs"] }
# Encoding a recovered address without going through `zcash_keys`, whose
# `UnifiedAddress::from_receivers` changes arity with the `sapling` feature —
# and feature unification with the fork's crates turns that on under
# `--all-features`.
zcash_address.workspace = true
zip32.workspace = true
transparent = { workspace = true, features = ["transparent-inputs"] }
zcash_script.workspace = true
zakura-wallet-core = { path = "../wallet-core" }
zcash_protocol.workspace = true

[dev-dependencies]
assert_matches.workspace = true
zip32.workspace = true
orchard.workspace = true
# Detection is only a dev-dependency: the store consumes `DetectedBatch`, which
# lives in `core`, so there is no production coupling between the two.
zakura-wallet-scan = { path = "../wallet-scan", features = ["test-dependencies"] }
incrementalmerkletree = { workspace = true, features = ["test-dependencies"] }
proptest.workspace = true
zakura-wallet-store = { path = ".", features = ["test-dependencies"] }
