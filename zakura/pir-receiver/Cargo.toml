[package]
name = "zakura-pir-receiver"
version = "0.0.1-rc0"
publish = false
description = "Restore sweeps of one-time IVKs through a receiver directory over PIR"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = []
## The restore sweep, over a wallet store's one-time IVK traits.
wallet = ["dep:thiserror", "dep:zakura-one-time-ivk", "dep:zcash_client_backend", "dep:zcash_protocol"]

[dependencies]
thiserror = { version = "2", optional = true }
zakura-one-time-ivk = { version = "=0.0.1-rc0", path = "../one-time-ivk", optional = true }
zcash_client_backend = { workspace = true, features = ["one-time-ivk"], optional = true }
zcash_protocol = { workspace = true, optional = true }
# The receiver crates come from wallet-pir's `main`.
receiver-directory = { git = "https://github.com/valargroup/wallet-pir", rev = "a65634b4f2f2cd3fa00c6f9eb32345362cf3983c" }
receiver-pir = { git = "https://github.com/valargroup/wallet-pir", rev = "a65634b4f2f2cd3fa00c6f9eb32345362cf3983c" }

[dev-dependencies]
axum = "0.7"
orchard.workspace = true
receiver-pir = { git = "https://github.com/valargroup/wallet-pir", rev = "a65634b4f2f2cd3fa00c6f9eb32345362cf3983c", features = ["server"] }
receiver-pir-server = { git = "https://github.com/valargroup/wallet-pir", rev = "a65634b4f2f2cd3fa00c6f9eb32345362cf3983c" }
rusqlite = { workspace = true, features = ["hooks"] }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }
zcash_client_backend = { workspace = true, features = ["one-time-ivk", "test-dependencies"] }
zcash_client_sqlite = { path = "../../librustzcash/zcash_client_sqlite", package = "zakura-client-sqlite", features = ["one-time-ivk", "test-dependencies"] }
zcash_primitives.workspace = true

[[test]]
name = "sweep"
required-features = ["wallet"]
