[package]
name = "zakura-pir-receiver"
version = "0.0.1-rc0"
publish = false
description = "Restore sweeps of one-time IVKs through a receiver directory over PIR"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = []
## The restore sweep, over a wallet store's one-time IVK traits.
wallet = ["dep:thiserror", "dep:zakura-one-time-ivk", "dep:zcash_client_backend", "dep:zcash_protocol"]

[dependencies]
thiserror = { version = "2", optional = true }
zakura-one-time-ivk = { version = "=0.0.1-rc0", path = "../one-time-ivk", optional = true }
zcash_client_backend = { workspace = true, features = ["orchard"], optional = true }
zcash_protocol = { workspace = true, optional = true }
# Receiver protocol packages share this workspace's Common release family.
receiver-directory = { package = "zakura-receiver-directory", version = "=0.0.1-rc0", path = "../receiver-directory" }
receiver-pir = { package = "zakura-receiver-pir", version = "=0.0.1-rc0", path = "../receiver-pir" }

[dev-dependencies]
axum = "0.7"
orchard.workspace = true
receiver-pir = { package = "zakura-receiver-pir", version = "=0.0.1-rc0", path = "../receiver-pir", features = ["server"] }
receiver-pir-server = { package = "zakura-receiver-pir-server", version = "=0.0.1-rc0", path = "../receiver-pir-server" }
rusqlite = { workspace = true, features = ["hooks"] }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }
zcash_client_backend = { workspace = true, features = ["orchard", "test-dependencies"] }
zcash_client_sqlite = { path = "../../librustzcash/zcash_client_sqlite", package = "zakura-client-sqlite", features = ["orchard", "test-dependencies"] }
zcash_primitives.workspace = true

[[test]]
name = "sweep"
required-features = ["wallet"]
