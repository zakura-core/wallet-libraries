[package]
name = "zakura-pir-receiver"
version = "0.0.1-rc0"
publish = false
description = "Discovery of a restored seed's one-time IVKs through a receiver directory over PIR"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = []
## Typed network steps consumed by the wallet recovery queue.
wallet = ["dep:zcash_client_backend", "dep:zcash_protocol"]

[dependencies]
zcash_client_backend = { workspace = true, features = ["orchard"], optional = true }
zcash_protocol = { workspace = true, optional = true }
receiver-directory = { package = "zakura-receiver-directory", path = "../receiver-directory" }
receiver-pir = { package = "zakura-receiver-pir", path = "../receiver-pir" }
# Receiver validation and the common witness file discovery checks payments against.
zakura-receiver-crypto = { path = "../receiver-crypto" }

[dev-dependencies]
hex.workspace = true
orchard.workspace = true
# The evaluator answers the tests' encrypted queries in process.
receiver-pir = { package = "zakura-receiver-pir", path = "../receiver-pir", features = ["server"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
zcash_client_backend = { workspace = true, features = ["orchard", "test-dependencies"] }
zcash_client_sqlite = { path = "../../librustzcash/zcash_client_sqlite", package = "zakura-client-sqlite", features = ["orchard", "test-dependencies"] }
zcash_primitives.workspace = true

[[test]]
name = "discovery"
required-features = ["wallet"]
