[package]
name = "zakura-pir-native"
version = "0.0.1-rc2"
description = "Native two-mask InspiRING primitives shared by Zakura PIR clients and servers"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
keywords = ["zcash", "privacy", "pir"]

[features]
default = []
## Server-side counterparts of the client primitives, for protocol tests.
test-server = []

[dependencies]
ipir-sp = { version = "=0.1.0-rc.7", git = "https://github.com/valargroup/ipir-sp", rev = "a719f820c59e60c5f08997a57b875b9090b7e53e", features = ["native-reinspiring"] }
rand = "0.8"
rand_chacha.workspace = true
rayon.workspace = true
reinspiring = { version = "=0.1.3-rc.1", git = "https://github.com/valargroup/ipir-sp", rev = "a719f820c59e60c5f08997a57b875b9090b7e53e" }

[dev-dependencies]
hex = { workspace = true, features = ["std"] }
sha2.workspace = true
