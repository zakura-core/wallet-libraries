[package]
name = "zakura-pir-native"
version = "0.0.1-rc2"
description = "Native two-mask InspiRING primitives shared by Zakura PIR clients and servers"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
keywords = ["zcash", "privacy", "pir"]

[features]
default = []
## Preparing queries and decoding responses.
client = ["dep:rand", "dep:rand_chacha"]
## Building the hint, preprocessing, publishing masks, parsing queries and
## packing responses.
server = ["dep:rayon"]
## An in-memory database answering client queries with the server
## operations, for protocol tests.
test-server = ["server"]

[dependencies]
ipir-sp = { version = "=0.1.0-rc.7", features = ["native-reinspiring"] }
rand = { version = "0.8", optional = true }
rand_chacha = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
reinspiring = "=0.1.3-rc.1"

[dev-dependencies]
hex = { workspace = true, features = ["std"] }
sha2.workspace = true

[[test]]
name = "golden"
required-features = ["client", "server"]

[[test]]
name = "dithered"
required-features = ["client", "server"]

[[test]]
name = "p8"
required-features = ["client", "server"]
