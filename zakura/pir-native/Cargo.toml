[package]
name = "zakura-pir-native"
version = "0.0.1-rc2"
description = "Native two-mask InspiRING primitives shared by Zakura PIR clients and servers"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
keywords = ["zcash", "privacy", "pir"]

[features]
default = []
## Server-side counterparts of the client primitives, for protocol tests.
test-server = []

[dependencies]
ipir-native-client = { version = "=0.1.0-rc.1", git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2" }
rand = "0.8"
rand_chacha.workspace = true
rayon.workspace = true
reinspiring = { version = "=0.1.3-rc.1", git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2" }

[dev-dependencies]
hex = { workspace = true, features = ["std"] }
sha2.workspace = true
