[package]
name = "zakura-one-time-ivk-scenarios"
version = "0.0.0"
publish = false
description = "Scenario suite for one-time IVKs: issuance, live and restored detection, and cost"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

# The library holds only the report model and its renderers. The scenarios and
# their harness are the `scenarios` test target, so the wallet's test features
# stay out of every normal build.
[dependencies]
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true

[dev-dependencies]
axum = "0.7"
incrementalmerkletree.workspace = true
orchard = { workspace = true, features = ["circuit"] }
receiver-directory = { package = "zakura-receiver-directory", version = "=0.0.1-rc0", path = "../receiver-directory" }
receiver-pir = { package = "zakura-receiver-pir", version = "=0.0.1-rc0", path = "../receiver-pir", features = ["server"] }
receiver-pir-server = { package = "zakura-receiver-pir-server", version = "=0.0.1-rc0", path = "../receiver-pir-server" }
rusqlite.workspace = true
sapling = { workspace = true, features = ["test-dependencies"] }
secrecy.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tower = { workspace = true, features = ["util"] }
transparent.workspace = true
zakura-near-intents = { path = "../near-intents" }
zakura-one-time-ivk = { path = "../one-time-ivk" }
zakura-pir-receiver = { path = "../pir-receiver", features = ["wallet"] }
zcash_client_backend = { workspace = true, features = ["orchard", "test-dependencies"] }
zcash_client_sqlite = { path = "../../librustzcash/zcash_client_sqlite", package = "zakura-client-sqlite", features = ["orchard", "test-dependencies"] }
zcash_keys = { workspace = true, features = ["orchard"] }
zcash_note_encryption.workspace = true
zcash_primitives.workspace = true
zcash_protocol = { workspace = true, features = ["local-consensus"] }
zip321.workspace = true

[[test]]
name = "scenarios"
path = "tests/scenarios/main.rs"
harness = false

[lints]
workspace = true
