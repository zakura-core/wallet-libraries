[package]
name = "zakura-pir-config"
description = "Wallet PIR configuration profile: static/dynamic config schema, server identity and explicit server selection"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "zakura_pir_config"

# The config repository's CI validates published documents with this binary,
# so it shares the library's types instead of a second schema.
[[bin]]
name = "wallet-pir-config"
path = "src/bin/wallet-pir-config.rs"

# Parsing only. No async runtime, HTTP client, wallet backend, PIR engine or
# server may appear here: applications own transport, scheduling and storage.
[dependencies]
zakura-service-config = { path = "../service-config", version = "0.1.0" }
zakura-pir-protocol = { path = "../pir-protocol", version = "=0.0.1-rc4", features = ["http-endpoint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
sha2 = "0.10"
hex = "0.4"
