[package]
# Underscores, unlike every other crate here. Cargokit derives the library
# filename it looks for from the *package* name verbatim, while Cargo derives
# the actual filename from the lib name — and a lib name cannot contain a dash.
# Naming this `zakura-wallet-bridge` makes Cargokit hunt for
# `libzakura-wallet-bridge.a`, which Cargo never produces.
name = "zakura_wallet_bridge"
version = "0.1.0"
description = "The flutter_rust_bridge surface over the Zakura wallet facade"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "zakura_wallet_bridge"
# `cdylib` for Android and the desktops, `staticlib` for Apple platforms, and
# `lib` so the crate's own tests can link it.
crate-type = ["cdylib", "staticlib", "lib"]

[features]
# Sending is compiled out unless asked for. The recovery beta is built without
# it, so a direct call to `send` or `quote` through the generated bridge is
# refused by the facade whatever it is given, and `build_info` says so. Nothing
# in the generated surface changes with the feature: the functions exist either
# way and answer `SendDisabled` (code 20) when it is off.
default = []
# See the facade: loopback fixture services for rehearsals, never shipped.
fixture-loopback = ["zakura-wallet-facade/fixture-loopback"]
send = []

[dependencies]
# Pinned exactly. The generated Dart and the generated Rust are two halves of
# one artefact, and a version skew between them fails at runtime rather than at
# compile time.
flutter_rust_bridge = "=2.11.1"
zakura-wallet-facade = { path = "../facade" }
