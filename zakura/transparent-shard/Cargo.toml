[package]
name = "zakura-transparent-shard"
version = "0.0.1-rc0"
# Kept at 2021 from wallet-pir so the moved code compiles unchanged.
edition = "2021"
description = "Transparent PIR shard maps, manifests and table codecs"
rust-version.workspace = true
license = "MIT"
repository.workspace = true
readme = "README.md"
categories.workspace = true
keywords = ["zcash", "privacy", "pir"]

[lib]
# The library keeps wallet-pir's crate name, so `transparent_shard::` paths
# are unchanged for its consumers.
name = "transparent_shard"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
transparent-events = { package = "zakura-transparent-events", version = "=0.0.1-rc0", path = "../transparent-events" }
transparent-filter = { package = "zakura-transparent-filter", version = "=0.0.1-rc0", path = "../transparent-filter" }
